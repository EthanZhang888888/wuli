<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>物理沙盒 · 参数实验台</title>
    <!-- Font Awesome 图标库 (免费) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .sandbox-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -10px rgba(0, 20, 40, 0.25), inset 0 1px 2px rgba(255,255,255,0.6);
            padding: 30px 30px 40px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* 头部 */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            background: #1a3b5d;
            color: white;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 1.8rem;
            box-shadow: 0 8px 14px -6px rgba(20, 60, 120, 0.3);
        }

        .badge-pro {
            background: #ffb347;
            color: #1f2a3a;
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 8px rgba(255, 180, 50, 0.3);
            border: 1px solid rgba(255, 215, 120, 0.5);
        }

        .badge-pro i {
            font-size: 1rem;
        }

        /* 主布局: 实验台 + 侧边报告 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 28px;
        }

        @media (max-width: 880px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        /* ===== 左: 实验台 ===== */
        .experiment-stage {
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 24px 24px 30px;
            box-shadow: 0 8px 20px rgba(0, 20, 30, 0.08);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .stage-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-weight: 500;
            color: #1d3557;
        }

        .stage-title span {
            background: #dce9f7;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1f4a7a;
        }

        .canvas-wrapper {
            background: #eef3fc;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.02), 0 10px 20px -10px rgba(0,20,40,0.1);
            aspect-ratio: 16 / 10;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #physicsCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #eef3fc;
            cursor: grab;
        }

        #physicsCanvas:active {
            cursor: grabbing;
        }

        /* 参数控制区 */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px 20px;
            margin-top: 28px;
        }

        .param-item {
            background: #f2f8ff;
            border-radius: 24px;
            padding: 14px 18px 18px;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .param-item label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            color: #1f3a57;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .param-item label i {
            color: #3e6b9b;
            width: 20px;
        }

        .param-item input[type="range"] {
            width: 100%;
            height: 6px;
            background: #cbdae9;
            border-radius: 10px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            margin: 8px 0 4px;
        }

        .param-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #1f4f8a;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(20, 60, 130, 0.3);
            border: 2px solid white;
            transition: 0.1s;
        }

        .param-value {
            text-align: right;
            font-size: 0.9rem;
            font-weight: 600;
            color: #123456;
            background: white;
            padding: 2px 12px;
            border-radius: 40px;
            display: inline-block;
            float: right;
            margin-top: 4px;
            border: 1px solid #d0def0;
        }

        .reset-btn {
            background: #e3ecf9;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1f4a7a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .reset-btn:hover {
            background: #d0e2f7;
            border-color: #8eb3d9;
        }

        /* ===== 右侧报告面板 ===== */
        .report-sidebar {
            background: #ffffffd9;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 24px 20px 28px;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 8px 24px rgba(0, 20, 30, 0.08);
            display: flex;
            flex-direction: column;
        }

        .report-sidebar h3 {
            font-weight: 600;
            color: #0b2a47;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .report-sidebar h3 i {
            color: #2b6a9e;
        }

        .report-meta {
            font-size: 0.8rem;
            color: #567394;
            border-bottom: 1px solid #dae5f2;
            padding-bottom: 14px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
        }

        .report-content {
            flex: 1;
            background: #f4faff;
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 22px;
            border: 1px solid #e2edfb;
            min-height: 180px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #1f3853;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
        }

        .report-content p {
            margin-bottom: 8px;
        }

        .report-content .highlight {
            background: #dceaff;
            padding: 2px 8px;
            border-radius: 40px;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }

        .btn-primary, .btn-outline {
            border: none;
            padding: 14px 10px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: white;
            border: 1px solid #c6d9ee;
            color: #1f4a7a;
        }

        .btn-primary {
            background: #1f4f8a;
            color: white;
            border: 1px solid #1f4f8a;
            box-shadow: 0 8px 16px -6px #1f4f8a55;
        }

        .btn-primary i {
            color: #ffd966;
        }

        .btn-primary:hover {
            background: #143b66;
            transform: scale(1.01);
            box-shadow: 0 10px 20px -6px #143b66aa;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b6cee9;
        }

        .btn-outline:hover {
            background: #e7f0fd;
            border-color: #8eb3db;
        }

        .btn-outline i {
            color: #2b6a9e;
        }

        .lock-icon {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .footnote {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #6a86a3;
            text-align: center;
            border-top: 1px solid #dae5f2;
            padding-top: 16px;
        }

        /* 响应式微调 */
        @media (max-width: 600px) {
            .sandbox-container {
                padding: 16px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

<div class="sandbox-container">
    <!-- 头部 -->
    <div class="header">
        <h1><i class="fas fa-flask"></i> 物理沙盒 · 实验台</h1>
        <div class="badge-pro"><i class="fas fa-crown"></i> 专业版 · 报告导出</div>
    </div>

    <!-- 主布局 -->
    <div class="main-layout">
        <!-- 左侧：实验台 -->
        <div class="experiment-stage">
            <div class="stage-title">
                <span><i class="fas fa-arrow-pointer" style="margin-right: 6px;"></i> 拖拽小球 · 实时交互</span>
                <button class="reset-btn" id="resetSimBtn"><i class="fas fa-rotate-right"></i> 重置</button>
            </div>

            <!-- Canvas -->
            <div class="canvas-wrapper">
                <canvas id="physicsCanvas" width="800" height="500"></canvas>
            </div>

            <!-- 参数控制器 -->
            <div class="controls-grid">
                <div class="param-item">
                    <label><i class="fas fa-weight-scale"></i> 质量 (m) <span class="param-value" id="massVal">1.0</span></label>
                    <input type="range" id="massSlider" min="0.2" max="3.0" step="0.1" value="1.0">
                </div>
                <div class="param-item">
                    <label><i class="fas fa-arrow-right"></i> 初速度 (v₀) <span class="param-value" id="velVal">3.0</span></label>
                    <input type="range" id="velocitySlider" min="0.5" max="6.0" step="0.2" value="3.0">
                </div>
                <div class="param-item">
                    <label><i class="fas fa-droplet"></i> 阻尼 (b) <span class="param-value" id="dampVal">0.02</span></label>
                    <input type="range" id="dampingSlider" min="0.00" max="0.10" step="0.002" value="0.02">
                </div>
                <div class="param-item" style="grid-column: span 1; display: flex; align-items: center; gap: 8px; background: #e6f0fe;">
                    <i class="fas fa-arrows-spin" style="color: #1f4f8a;"></i>
                    <span style="font-weight: 500; color: #1f3a57;">恢复系数 e = <span id="restitutionVal">0.85</span></span>
                    <input type="range" id="restitutionSlider" min="0.30" max="1.00" step="0.01" value="0.85" style="flex:1;">
                </div>
            </div>
        </div>

        <!-- 右侧：报告/导出面板 -->
        <div class="report-sidebar">
            <h3><i class="fas fa-file-pen"></i> 实验报告</h3>
            <div class="report-meta">
                <span><i class="far fa-clock"></i> 实时更新</span>
                <span><i class="fas fa-circle" style="color: #2b9e6a; font-size: 0.6rem;"></i> 动态参数</span>
            </div>

            <div class="report-content" id="reportContent">
                <p><i class="fas fa-circle" style="color: #2b6a9e; font-size: 0.6rem;"></i> <strong>当前状态</strong></p>
                <p>质量: <span class="highlight" id="reportMass">1.0</span> kg</p>
                <p>初速度: <span class="highlight" id="reportVel">3.0</span> m/s</p>
                <p>阻尼: <span class="highlight" id="reportDamp">0.02</span> N·s/m</p>
                <p>恢复系数: <span class="highlight" id="reportRest">0.85</span></p>
                <p style="margin-top: 10px; border-top: 1px dashed #b8cfe5; padding-top: 10px;">
                    <i class="fas fa-arrow-trend-up"></i> 能量损失: <span id="energyLoss" class="highlight">0.0</span> J
                </p>
                <p><i class="fas fa-bolt"></i> 模拟步数: <span id="stepCounter">0</span></p>
            </div>

            <div class="action-buttons">
                <button class="btn-primary" id="exportReportBtn"><i class="fas fa-file-pdf"></i> 导出完整报告 (付费)</button>
                <button class="btn-outline" id="exportQuestionBtn"><i class="fas fa-file-export"></i> 导出题目 & 数据 (付费)</button>
                <div style="font-size: 0.75rem; color: #4f7193; display: flex; gap: 8px; justify-content: center; margin-top: 4px;">
                    <i class="fas fa-lock"></i> 高级导出需订阅专业版
                </div>
            </div>
            <div class="footnote">
                <i class="fas fa-rotate"></i> 拖拽小球改变初始位置
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ----- 获取 DOM 元素 -----
        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        // 滑块
        const massSlider = document.getElementById('massSlider');
        const velocitySlider = document.getElementById('velocitySlider');
        const dampingSlider = document.getElementById('dampingSlider');
        const restitutionSlider = document.getElementById('restitutionSlider');

        const massVal = document.getElementById('massVal');
        const velVal = document.getElementById('velVal');
        const dampVal = document.getElementById('dampVal');
        const restitutionVal = document.getElementById('restitutionVal');

        // 报告字段
        const reportMass = document.getElementById('reportMass');
        const reportVel = document.getElementById('reportVel');
        const reportDamp = document.getElementById('reportDamp');
        const reportRest = document.getElementById('reportRest');
        const energyLossSpan = document.getElementById('energyLoss');
        const stepCounterSpan = document.getElementById('stepCounter');

        // 按钮
        const resetBtn = document.getElementById('resetSimBtn');
        const exportReportBtn = document.getElementById('exportReportBtn');
        const exportQuestionBtn = document.getElementById('exportQuestionBtn');

        // ----- 物理参数 -----
        let mass = 1.0;
        let initialVelocity = 3.0;
        let damping = 0.02;
        let restitution = 0.85;

        // 小球状态
        let ball = {
            x: 200, y: 250,
            vx: 3.0, vy: 0.6,
            radius: 18,
            mass: 1.0,
        };

        // 边界 (基于canvas尺寸)
        const W = 800, H = 500;
        const GROUND_Y = 440;    // 地面高度 (y坐标)
        const LEFT_WALL = 40;
        const RIGHT_WALL = W - 40;

        let stepCount = 0;
        let initialEnergy = 0;
        let energyLoss = 0;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;

        // 重置模拟 (保留当前参数)
        function resetSimulation() {
            // 读取最新滑块数值
            mass = parseFloat(massSlider.value);
            initialVelocity = parseFloat(velocitySlider.value);
            damping = parseFloat(dampingSlider.value);
            restitution = parseFloat(restitutionSlider.value);

            ball.mass = mass;
            ball.radius = 16 + mass * 4;  // 视觉大小随质量变化
            // 放在中间偏左，赋予初速度
            ball.x = 180;
            ball.y = GROUND_Y - ball.radius - 10;
            ball.vx = initialVelocity * 0.9;
            ball.vy = -1.2;   // 稍微向上

            stepCount = 0;
            // 计算初始能量 (近似)
            const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            initialEnergy = 0.5 * mass * speed * speed;
            energyLoss = 0;
            updateReport();
            drawScene();
        }

        // 更新报告UI
        function updateReport() {
            reportMass.textContent = mass.toFixed(2);
            reportVel.textContent = initialVelocity.toFixed(2);
            reportDamp.textContent = damping.toFixed(3);
            reportRest.textContent = restitution.toFixed(2);
            energyLossSpan.textContent = energyLoss.toFixed(3);
            stepCounterSpan.textContent = stepCount;
        }

        // 更新滑块数值显示
        function updateSlidersDisplay() {
            massVal.textContent = massSlider.value;
            velVal.textContent = velocitySlider.value;
            dampVal.textContent = dampingSlider.value;
            restitutionVal.textContent = restitutionSlider.value;
        }

        // ----- 物理更新 (简单欧拉) -----
        function physicsUpdate() {
            // 重力
            const gravity = 0.35;
            // 空气阻尼 (与速度正比)
            const dampCoeff = damping;

            // 速度更新 (含阻尼)
            ball.vx *= (1 - dampCoeff * 0.5);
            ball.vy *= (1 - dampCoeff * 0.5);
            ball.vy += gravity;

            // 位置更新
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 边界碰撞 (地面)
            if (ball.y + ball.radius > GROUND_Y) {
                ball.y = GROUND_Y - ball.radius;
                // 法向恢复系数
                if (ball.vy > 0.5) {
                    ball.vy = -ball.vy * restitution;
                    // 切向摩擦损失 (小量)
                    ball.vx *= 0.995;
                } else {
                    ball.vy = 0;  // 静止
                }
                // 小量能量损失
            }

            // 左右墙壁
            if (ball.x - ball.radius < LEFT_WALL) {
                ball.x = LEFT_WALL + ball.radius;
                ball.vx = -ball.vx * restitution;
            } else if (ball.x + ball.radius > RIGHT_WALL) {
                ball.x = RIGHT_WALL - ball.radius;
                ball.vx = -ball.vx * restitution;
            }

            // 防止球跑出顶部
            if (ball.y - ball.radius < 10) {
                ball.y = 10 + ball.radius;
                ball.vy = -ball.vy * restitution;
            }

            // 计算能量损失 (基于当前速度与初始能量)
            const v = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            const currentEnergy = 0.5 * ball.mass * v * v;
            if (initialEnergy > 0.01) {
                energyLoss = initialEnergy - currentEnergy;
                if (energyLoss < 0) energyLoss = 0;
            } else {
                // 初始能量很小则重新校准
                if (v > 0.1) initialEnergy = 0.5 * ball.mass * v * v;
            }

            stepCount++;
            updateReport();
        }

        // ----- 绘图 -----
        function drawScene() {
            ctx.clearRect(0, 0, W, H);

            // 渐变背景
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#dae8fc');
            grad.addColorStop(0.7, '#c8daf0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 地面
            ctx.fillStyle = '#7699b9';
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 6;
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.shadowBlur = 0;

            // 地面细节
            ctx.strokeStyle = '#5b7f9e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(W, GROUND_Y);
            ctx.stroke();

            // 墙壁
            ctx.fillStyle = '#b0c7de';
            ctx.shadowBlur = 4;
            ctx.fillRect(LEFT_WALL-6, 10, 6, GROUND_Y-10);
            ctx.fillRect(RIGHT_WALL, 10, 6, GROUND_Y-10);
            ctx.shadowBlur = 0;

            // 绘制小球 (带光泽)
            const r = ball.radius;
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 14;
            // 主体
            const gradient = ctx.createRadialGradient(
                ball.x - 6, ball.y - 6, r*0.1,
                ball.x, ball.y, r
            );
            gradient.addColorStop(0, '#ffb57c');
            gradient.addColorStop(0.5, '#e07c3e');
            gradient.addColorStop(1, '#aa4f1a');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
            ctx.fill();
            // 高光
            ctx.shadowBlur = 6;
            ctx.fillStyle = 'rgba(255,255,230,0.4)';
            ctx.beginPath();
            ctx.arc(ball.x-5, ball.y-7, r*0.25, 0, Math.PI*2);
            ctx.fill();

            // 速度向量指示
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#1f3a5e';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + ball.vx * 6, ball.y + ball.vy * 6);
            ctx.stroke();
            ctx.fillStyle = '#1f3a5e';
            ctx.font = '12px "Segoe UI"';
            ctx.fillText('v', ball.x + ball.vx * 6 + 6, ball.y + ball.vy * 6 - 4);

            // 信息水印
            ctx.fillStyle = '#3a5d7a';
            ctx.font = '12px "Segoe UI"';
            ctx.fillText(`m = ${ball.mass.toFixed(2)} kg`, 20, 30);
            ctx.fillText(`步数: ${stepCount}`, 20, 50);
            ctx.shadowBlur = 0;
        }

        // ----- 动画循环 -----
        function animate() {
            physicsUpdate();
            drawScene();
            requestAnimationFrame(animate);
        }

        // ----- 滑块事件绑定 (更新参数) -----
        function onSliderChange() {
            mass = parseFloat(massSlider.value);
            initialVelocity = parseFloat(velocitySlider.value);
            damping = parseFloat(dampingSlider.value);
            restitution = parseFloat(restitutionSlider.value);

            ball.mass = mass;
            ball.radius = 16 + mass * 4;
            // 更新初速度显示，并重置能量基准
            const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            if (speed > 0.1) {
                initialEnergy = 0.5 * mass * speed * speed;
            }

            updateSlidersDisplay();
            updateReport();
        }

        massSlider.addEventListener('input', onSliderChange);
        velocitySlider.addEventListener('input', onSliderChange);
        dampingSlider.addEventListener('input', onSliderChange);
        restitutionSlider.addEventListener('input', onSliderChange);

        // 重置
        resetBtn.addEventListener('click', resetSimulation);

        // ----- 拖拽交互 (鼠标) -----
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function onPointerDown(e) {
            const pos = getMousePos(e);
            const dx = pos.x - ball.x;
            const dy = pos.y - ball.y;
            if (dx*dx + dy*dy < (ball.radius + 20) ** 2) {
                isDragging = true;
                dragOffsetX = dx;
                dragOffsetY = dy;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const pos = getMousePos(e);
            let newX = pos.x - dragOffsetX;
            let newY = pos.y - dragOffsetY;
            // 边界约束
            newX = Math.min(RIGHT_WALL - ball.radius, Math.max(LEFT_WALL + ball.radius, newX));
            newY = Math.min(GROUND_Y - ball.radius, Math.max(10 + ball.radius, newY));
            ball.x = newX;
            ball.y = newY;
            // 拖拽时速度归零
            ball.vx = 0;
            ball.vy = 0;
            initialEnergy = 0;
            energyLoss = 0;
            stepCount = 0;
            updateReport();
            drawScene();
            e.preventDefault();
        }

        function onPointerUp(e) {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';
                // 稍微赋一个随机初速度, 让球动起来
                ball.vx = (Math.random() - 0.5) * 2;
                ball.vy = -1.5;
                const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                if (speed > 0.1) initialEnergy = 0.5 * ball.mass * speed * speed;
                stepCount = 0;
                updateReport();
                e.preventDefault();
            }
        }

        // 鼠标事件
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        // 触摸事件
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        window.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp, {passive: false});

        // ----- 导出按钮 (模拟付费) -----
        function handleExport(type) {
            const reportText = `物理沙盒实验报告
            ==========================
            质量: ${mass.toFixed(2)} kg
            初速度: ${initialVelocity.toFixed(2)} m/s
            阻尼系数: ${damping.toFixed(3)}
            恢复系数: ${restitution.toFixed(2)}
            当前能量损失: ${energyLoss.toFixed(3)} J
            模拟步数: ${stepCount}
            小球位置: (${ball.x.toFixed(1)}, ${ball.y.toFixed(1)})
            速度: (${ball.vx.toFixed(2)}, ${ball.vy.toFixed(2)})
            ==========================
            【付费导出】专业版功能
            如需完整报告/题目，请订阅。`;

            if (type === 'report') {
                alert('🔒 付费功能：导出完整报告 (PDF/Word)\n\n' + reportText + '\n\n(演示弹窗，实际付款后生成)');
            } else {
                alert('📘 付费功能：导出题目 + 数据 (含图表)\n\n' + reportText + '\n\n(演示弹窗，实际付款后生成)');
            }
        }

        exportReportBtn.addEventListener('click', () => handleExport('report'));
        exportQuestionBtn.addEventListener('click', () => handleExport('question'));

        // 初始化
        resetSimulation();
        // 启动动画
        animate();
    })();
</script>
</body>
</html>
